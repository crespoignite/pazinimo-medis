[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Deploy previews and branch deploys show a sample campaign banner so the
# banner position can be reviewed. Production never sets this variable.
[context.deploy-preview.environment]
  PUBLIC_DEMO_BANNER = "true"

[context.branch-deploy.environment]
  PUBLIC_DEMO_BANNER = "true"

# The first language a visitor sees. Change "en" to "lt" at launch.
# The same switch lives in src/i18n/index.ts (defaultLang).
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302

[[redirects]]
  from = "/blog"
  to = "/en/about/news/"
  status = 301

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
