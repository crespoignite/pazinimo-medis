[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview.environment]
  PUBLIC_DEMO_BANNER = "true"

[context.branch-deploy.environment]
  PUBLIC_DEMO_BANNER = "true"

# The first language a visitor sees (now Lithuanian).
# The same switch lives in src/i18n/index.ts (defaultLang).
[[redirects]]
  from = "/"
  to = "/lt/"
  status = 302

[[redirects]]
  from = "/blog"
  to = "/lt/about/news/"
  status = 301

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    # PRE-LAUNCH: keeps the site out of search results. Delete this line at launch.
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
